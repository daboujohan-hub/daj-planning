name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DAJ_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Signature fixe (si configurée)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/daj.p12"
            echo "DAJ_KEYSTORE=$RUNNER_TEMP/daj.p12" >> "$GITHUB_ENV"
            echo "Signature fixe activée"
          else
            echo "Pas de clé : signature temporaire"
          fi

      - name: Créer le squelette Android
        run: flutter create --org com.aboudev --project-name daj_planning --platforms=android build_app

      - name: Copier notre code et patcher Android
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib
          python3 make_icon.py build_app/assets
          python3 patch_android.py build_app/android

      - name: Récupérer les paquets
        working-directory: build_app
        run: flutter pub get

      - name: Icône de l'appli (sans bloquer si ça échoue)
        working-directory: build_app
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Compiler l'APK
        working-directory: build_app
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Empreinte de la signature
        continue-on-error: true
        run: keytool -printcert -jarfile build_app/build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: DAJ-Planning-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
