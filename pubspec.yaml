name: daj_planning
description: DAJ Planning - Aboudev Labs
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.0.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
